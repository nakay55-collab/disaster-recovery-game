<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8720c">
  <title>報酬計算・ランキング管理ツール | 災害復旧・まちづくりゲーム</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title"><span class="topbar-mark" aria-hidden="true">￥</span> 報酬計算・ランキング管理</div>
    <div class="topbar-actions">
      <button id="btn-ranking" type="button" class="ghost-button">ランキング表示</button>
      <button id="btn-undo" type="button" class="ghost-button">1つ戻す</button>
      <button id="btn-reset" type="button" class="ghost-button danger">ゲームを最初からやり直す</button>
    </div>
  </header>
  <p id="storage-warning" class="notice" role="alert" hidden>このブラウザではデータを保存できません。作業中はページを閉じたり再読み込みしたりしないでください。</p>
  <nav class="tabs" id="tabs"></nav>
  <main id="app"></main>

  <div id="projector" class="projector" hidden></div>

  <dialog id="reset-dialog" aria-labelledby="reset-title">
    <h2 id="reset-title">本当に全データを削除しますか？</h2>
    <p>チーム名以外の、報酬・選択済みミッション・履歴・地域貢献ボーナスの状態がすべて初期化されます。この操作は取り消せません。</p>
    <div class="dialog-actions"><button id="cancel-reset" class="secondary" type="button">キャンセル</button><button id="confirm-reset" class="primary danger" type="button">削除して最初からやり直す</button></div>
  </dialog>

  <dialog id="quiz-confirm-dialog" aria-labelledby="quiz-confirm-title">
    <h2 id="quiz-confirm-title">追加クイズ費用を減額します</h2>
    <p id="quiz-confirm-body"></p>
    <div class="dialog-actions"><button id="cancel-quiz" class="secondary" type="button">キャンセル</button><button id="confirm-quiz" class="primary" type="button">減額する</button></div>
  </dialog>

  <dialog id="bonus-grant-dialog" aria-labelledby="bonus-grant-title">
    <h2 id="bonus-grant-title">地域貢献ボーナスを加算します</h2>
    <p id="bonus-grant-body"></p>
    <div class="dialog-actions"><button id="cancel-bonus-grant" class="secondary" type="button">キャンセル</button><button id="confirm-bonus-grant" class="primary" type="button">加算する</button></div>
  </dialog>

  <dialog id="bonus-cancel-dialog" aria-labelledby="bonus-cancel-title">
    <h2 id="bonus-cancel-title">地域貢献ボーナスを取り消しますか？</h2>
    <p>加算済みのボーナスをすべて取り消し、対象チームから減算します。</p>
    <div class="dialog-actions"><button id="cancel-bonus-cancel" class="secondary" type="button">キャンセル</button><button id="confirm-bonus-cancel" class="primary danger" type="button">取り消す</button></div>
  </dialog>

  <noscript>このツールにはJavaScriptが必要です。ブラウザの設定でJavaScriptを有効にしてください。</noscript>
</body>
</html>
